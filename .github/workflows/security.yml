name: security
# Layered security scan for team projects — ADVISORY first, enforce later.
#   - secrets: gitleaks (catches leaked API/model keys — the #1 AI-vibecode failure)
#   - sast:    semgrep community rules (injection, insecure defaults)
# Dependency scanning is handled separately by Dependabot (.github/dependabot.yml).
#
# Both jobs use `continue-on-error: true` so findings are REPORTED but never block a
# merge while the team is learning to triage. Enforcement flip (ch-8):
#   1. remove `continue-on-error: true` from the job you want to enforce
#   2. mark that check "required" in the branch-protection ruleset
#
# NOTE: on PUBLIC repos GitHub's own secret scanning + push protection are also FREE —
# turn them on in Settings > Code security. This workflow is the portable, run-anywhere
# backup and works locally too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true          # ch-8: remove to enforce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # full history so gitleaks scans past commits too
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: gitleaks (secrets scan)
        # Binary, not Docker: the becd367 entrypoint fix (safe.directory /repo) already
        # tried to resolve a container UID/volume-mount "dubious ownership" failure and
        # didn't work — gitleaks:v8.30.1's own Dockerfile already sets
        # `safe.directory '*'` at build time, so that was never the real cause. Running
        # the binary directly on the runner sidesteps the whole container-layer failure
        # class. gitleaks-action@v2's paid-license requirement for organization accounts
        # applies only to that wrapper Action, not the OSS binary — running it directly
        # here stays license-free, same as the Docker invocation it replaces.
        run: ./gitleaks detect --source . --redact --verbose

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true          # ch-8: remove to enforce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # No `cache: pip` — it requires a requirements.txt/pyproject.toml to
          # key on, and this repo has none (semgrep is installed ad-hoc below).
      - name: Install semgrep
        run: python -m pip install --upgrade pip semgrep
      - name: Run semgrep (community rules)
        run: semgrep scan --config=auto --error --skip-unknown-extensions .
        # --config=auto pulls community rules for the languages it detects.
        # --error exits non-zero on findings; continue-on-error keeps the job green,
        # so findings are REPORTED IN THE RUN LOGS (open the step to read them).
        # Expect some false positives — triaging them is the lesson.
