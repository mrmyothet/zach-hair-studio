name: gitleaks
on:
  push:
  pull_request:

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default gitleaks (8.24.3) predates global [[allowlists]]
          # support (v8.25.0+) and ignores .gitleaks.toml allowlists — pin >= 8.25.
          GITLEAKS_VERSION: 8.30.1
          # Org-owned repos may require a license key; uncomment if prompted:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
